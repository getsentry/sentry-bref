name: CI

on:
    push:
        branches: ['main', 'release/**']
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    tests:
        name: Tests - PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                php: [ '8.2', '8.3', '8.4', '8.5' ]
                dependency-version: [ '' ]
                include:
                    -   php: '8.2'
                        dependency-version: '--prefer-lowest'
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: ${{ matrix.php }}
                    tools: composer:v2
                    coverage: none
            -   name: Cache Composer dependencies
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.composer/cache
                    key: php-${{ matrix.php }}-composer-locked-${{ hashFiles('composer.lock') }}
                    restore-keys: php-${{ matrix.php }}-composer-locked-
            -   name: Install PHP dependencies
                run: composer update ${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress --no-suggest
            -   name: PHPUnit
                run: vendor/bin/phpunit

    # Laravel and Symfony are optional: the core (Bref events, AWS SDK, PSR-15) must work without them
    tests-without-frameworks:
        name: Tests - PHP 8.5 without frameworks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.5'
                    tools: composer:v2
                    coverage: none
            -   name: Install PHP dependencies without Laravel and Symfony
                run: |
                    composer remove --dev --no-update laravel/framework bref/laravel-bridge sentry/sentry-laravel symfony/dependency-injection symfony/event-dispatcher symfony/http-kernel
                    composer update --prefer-dist --no-interaction --no-progress
            -   name: PHPUnit
                run: vendor/bin/phpunit --exclude-group laravel,symfony

    # Laravel 12 requires Symfony 7.2: the lowest supported Symfony version is tested without Laravel
    tests-symfony-lowest:
        name: Tests - PHP 8.2 --prefer-lowest Symfony without Laravel
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.2'
                    tools: composer:v2
                    coverage: none
            -   name: Install PHP dependencies without Laravel
                run: |
                    composer remove --dev --no-update laravel/framework bref/laravel-bridge sentry/sentry-laravel
                    composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
            -   name: PHPUnit
                run: vendor/bin/phpunit --exclude-group laravel

    php-cs-fixer:
        name: PHP CS Fixer
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.5'
                    tools: composer:v2
                    coverage: none
            -   name: Install PHP dependencies
                run: composer update --prefer-dist --no-interaction --no-progress
            -   name: PHP CS Fixer
                run: composer cs-check

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
                with:
                    php-version: '8.5'
                    tools: composer:v2
                    coverage: none
            -   name: Install PHP dependencies
                run: composer update --prefer-dist --no-interaction --no-progress
            -   name: PHPStan
                run: composer phpstan
